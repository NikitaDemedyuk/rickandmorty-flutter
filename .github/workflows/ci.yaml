name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Detect code generation
        id: codegen
        run: |
          if grep -q '^\s*build_runner:' pubspec.yaml; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check generated code is up to date
        if: steps.codegen.outputs.enabled == 'true'
        run: |
          dart run build_runner build -d
          git diff --exit-code

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/lcov.info') != ''
        run: |
          awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END {
              pct = found ? hit * 100 / found : 0
              printf "### Coverage\n\n%.1f%% (%d / %d lines)\n", pct, hit, found
            }
          ' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
