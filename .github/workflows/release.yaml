name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches pubspec version
        run: |
          if ! grep -q "^version: ${GITHUB_REF_NAME#v}+" pubspec.yaml; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $(grep '^version:' pubspec.yaml)"
            exit 1
          fi

      # Fail before the build if CHANGELOG.md has no section for this tag.
      - name: Extract release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [${GITHUB_REF_NAME#v}]' section"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "rickandmorty-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "rickandmorty-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
