# Native launch screen. After editing, regenerate the platform files with
#   fvm dart run flutter_native_splash:create
# and commit them; never hand-edit the generated launch files.
flutter_native_splash:
  # Night-sky navy behind the icon on every platform.
  color: "#151629"

  # The original portal icon (public repo: no show art), centered at its own
  # size like the Android 12+ splash, so every platform looks the same.
  image: assets/icon/icon_foreground.png
  ios_content_mode: center
  android_gravity: center

  # Android 12+ only allows a centered icon on a solid color.
  android_12:
    image: assets/icon/icon_foreground.png

  web: false
